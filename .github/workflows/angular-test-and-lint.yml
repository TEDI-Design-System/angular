name: Test and lint Angular

on:
  pull_request:
    branches:
      - main
      - rc

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Lint
        run: |
          npm ci --cache .npm --prefer-offline
          npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build library
        run: |
          npm ci --cache .npm --prefer-offline
          npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: library-dist
          path: dist/
          retention-days: 1

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Run coverage tests
        run: |
          npm run test:coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ./

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular-version: [19, 20, 21]
    name: compatibility (Angular ${{ matrix.angular-version }})
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Download built library
        uses: actions/download-artifact@v4
        with:
          name: library-dist
          path: dist/
      - name: Pack library tarball
        run: cd dist && npm pack
      - name: Create test app and verify build
        run: |
          npx @angular/cli@${{ matrix.angular-version }} new test-app \
            --skip-git --skip-tests --style=scss --ssr=false --skip-install
          cd test-app
          npm install
          npm install ../dist/*.tgz @angular/animations@${{ matrix.angular-version }} @angular/forms@${{ matrix.angular-version }} @angular/cdk@${{ matrix.angular-version }}

          # Import a component to verify the library is consumable
          cat > src/app/app.component.ts << 'EOF'
          import { Component } from '@angular/core';
          import { ButtonComponent } from '@tedi-design-system/angular/tedi';

          @Component({
            selector: 'app-root',
            standalone: true,
            imports: [ButtonComponent],
            template: '<button tedi-button>Test</button>',
          })
          export class AppComponent {}
          EOF

          npx ng build

  chromatic:
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.actor != 'dependabot[bot]'
      ) || (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/rc'
      )
    steps:
      - name: Checkout with branch context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch baseline branch (rc)
        run: git fetch origin rc

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Build Storybook
        run: |
          npm run build:sb

      - name: Publish to Chromatic
        run: |
          echo "CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_TOKEN }}"
          CHROMATIC_PROJECT_TOKEN=${{ secrets.CHROMATIC_TOKEN }} npm run chromatic
