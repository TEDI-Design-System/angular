name: Test and lint Angular

on:
  pull_request:
    branches:
      - main
      - rc

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Lint
        run: |
          npm ci --cache .npm --prefer-offline
          npm run lint

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular-version: [19, 20, 21]
    name: build (Angular ${{ matrix.angular-version }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline
      - name: Update to Angular ${{ matrix.angular-version }}
        run: |
          BASE=$(node -p "require('./package.json').devDependencies['@angular/core'].replace(/[^0-9].*/,'')")
          TARGET=${{ matrix.angular-version }}
          for ((v = BASE + 1; v <= TARGET; v++)); do
            echo "::group::Updating Angular $((v - 1)) -> $v"
            npx ng update @angular/core@$v @angular/cli@$v --allow-dirty --force
            npm install @angular/build@$v --force
            echo "::endgroup::"
          done
          if [ "$BASE" -ne "$TARGET" ]; then
            npm install @angular/cdk@$TARGET ngx-float-ui@$TARGET --force
          fi
      - name: Build library
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular-version: [19, 20, 21]
    name: test (Angular ${{ matrix.angular-version }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline
      - name: Update to Angular ${{ matrix.angular-version }}
        run: |
          BASE=$(node -p "require('./package.json').devDependencies['@angular/core'].replace(/[^0-9].*/,'')")
          TARGET=${{ matrix.angular-version }}
          for ((v = BASE + 1; v <= TARGET; v++)); do
            echo "::group::Updating Angular $((v - 1)) -> $v"
            npx ng update @angular/core@$v @angular/cli@$v --allow-dirty --force
            npm install @angular/build@$v --force
            echo "::endgroup::"
          done
          if [ "$BASE" -ne "$TARGET" ]; then
            npm install @angular/cdk@$TARGET ngx-float-ui@$TARGET --force
          fi
      - name: Test
        run: npm run test

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Run coverage tests
        run: |
          npm run test:coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ./

  chromatic:
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.actor != 'dependabot[bot]'
      ) || (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/rc'
      )
    steps:
      - name: Checkout with branch context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Fetch baseline branch (rc)
        run: git fetch origin rc

      - name: Set up Node
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Build Storybook
        run: |
          npm run build:sb

      - name: Publish to Chromatic
        run: |
          echo "CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_TOKEN }}"
          CHROMATIC_PROJECT_TOKEN=${{ secrets.CHROMATIC_TOKEN }} npm run chromatic
