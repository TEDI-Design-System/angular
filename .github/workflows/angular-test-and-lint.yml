name: Test and lint Angular

on:
  pull_request:
    branches:
      - main
      - rc

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Lint
        run: |
          npm ci --cache .npm --prefer-offline
          npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build library
        run: |
          npm ci --cache .npm --prefer-offline
          npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: library-dist
          path: dist/
          retention-days: 1

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Run coverage tests
        run: |
          npm run test:coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ./

  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build Storybook (tedi stories only)
        run: npm run build:sb:chromatic
        env:
          STORYBOOK_EXCLUDE_COMMUNITY: "true"
      - name: Run accessibility tests
        id: a11y
        run: |
          mkdir -p a11y-report
          npm run test-storybook:ci 2>&1 | tee a11y-report/output.log
        continue-on-error: true
        env:
          JEST_JUNIT_OUTPUT_DIR: a11y-report
          JEST_JUNIT_OUTPUT_NAME: junit.xml
      - name: Build accessibility summary
        if: always()
        run: node .github/scripts/a11y-report.mjs a11y-report/junit.xml a11y-report/output.log a11y-report/summary.md
      - name: Comment a11y summary on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- a11y-report -->";
            let body = marker + "\n";
            try {
              body += fs.readFileSync("a11y-report/summary.md", "utf8");
            } catch {
              body += "## ♿ Accessibility\n\nNo report was produced (the run may have failed before testing).";
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report/
          retention-days: 7
      - name: Fail if accessibility violations
        if: always() && steps.a11y.outcome == 'failure'
        run: |
          echo "::error::Accessibility violations detected — see the PR comment and job summary."
          exit 1

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular-version: [20, 21, 22]
    name: compatibility (Angular ${{ matrix.angular-version }})
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Download built library
        uses: actions/download-artifact@v4
        with:
          name: library-dist
          path: dist/
      - name: Pack library tarball
        run: cd dist && npm pack
      - name: Create test app and verify build
        run: |
          npx @angular/cli@${{ matrix.angular-version }} new test-app \
            --skip-git --skip-tests --style=scss --ssr=false --skip-install
          cd test-app
          npm install
          npm install ../dist/*.tgz @angular/forms@${{ matrix.angular-version }} @angular/cdk@${{ matrix.angular-version }}

          # Import a component to verify the library is consumable
          cat > src/app/app.component.ts << 'EOF'
          import { Component } from '@angular/core';
          import { ButtonComponent } from '@tedi-design-system/angular/tedi';

          @Component({
            selector: 'app-root',
            standalone: true,
            imports: [ButtonComponent],
            template: '<button tedi-button>Test</button>',
          })
          export class AppComponent {}
          EOF

          npx ng build

  chromatic:
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.actor != 'dependabot[bot]'
      ) || (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/rc'
      )
    steps:
      - name: Checkout with branch context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Publish to Chromatic
        run: |
          CHROMATIC_PROJECT_TOKEN=${{ secrets.CHROMATIC_TOKEN }} npm run chromatic
