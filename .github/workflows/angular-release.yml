name: Release TEDI Angular library

on:
  push:
    branches:
      - rc
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Lint
        run: |
          npm ci --cache .npm --prefer-offline
          npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular-version: [19, 20, 21]
    name: test (Angular ${{ matrix.angular-version }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline
      - name: Detect base Angular version
        id: base
        run: echo "version=$(node -p "require('./package.json').devDependencies['@angular/core'].replace(/[^0-9].*/,'')")" >> "$GITHUB_OUTPUT"
      - name: Update to Angular ${{ matrix.angular-version }}
        if: matrix.angular-version != fromJSON(steps.base.outputs.version)
        run: |
          npx ng update @angular/core@${{ matrix.angular-version }} @angular/cli@${{ matrix.angular-version }} --allow-dirty --force
          npm install @angular/cdk@${{ matrix.angular-version }} ngx-float-ui@${{ matrix.angular-version }} --force
      - name: Test
        run: npm run test

  chromatic:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/rc' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline
      - name: Build Storybook
        run: |
          npm run build:sb
      - name: Publish to Chromatic
        run: |
          CHROMATIC_PROJECT_TOKEN=${{ secrets.CHROMATIC_TOKEN }} npm run chromatic

  build-and-deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build and publish npm package
        run: |
          HUSKY=0
          npm ci
          npm run build
          git pull
          npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS_TEDI_AUTH_TOKEN }}

  merge-to-rc:
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge main into rc
        run: |
          git fetch origin rc
          git checkout rc
          git merge origin/main --no-edit || true
          git push origin rc
