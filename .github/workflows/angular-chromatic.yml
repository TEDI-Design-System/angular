name: Chromatic Angular

# One pre-merge build per pull request, on approval.
#
# A snapshot is billed whether or not it changed: TurboSnap copies an unchanged
# snapshot from the baseline rather than recapturing it, but a copy still bills
# at 0.2. So a build per push is never affordable on a library this size, and
# the react and angular projects share one 35,000/month quota.
#
# Approval is the point where the diff is worth looking at, and it captures the
# state that is about to merge. A PR merged without an approval gets no build
# here; it is covered by the `rc` push build in `angular-release.yml`, which is
# also what keeps the baseline current for the next PR.
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

# A second approval on the same PR supersedes the first rather than paying for
# both.
concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the result is posted back to the PR
    # `pull_request_review` takes no `branches:` filter, so the base branch is
    # checked here. Note that the dependabot check reads the PR author, not
    # `github.actor`, which on a review event is the reviewer.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.review.state == 'approved' &&
        (github.event.pull_request.base.ref == 'rc' || github.event.pull_request.base.ref == 'main') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TurboSnap walks back through git history to find the baseline
          # build, so a shallow clone would send it into a full rebuild.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      - name: Build Storybook
        run: npm run build:sb:chromatic

      # chromaui/action rather than the raw CLI, for the build result as step
      # outputs. Chromatic's GitHub App posts its UI Tests status on `rc`, not
      # on a PR head commit, so without the comment step below the one build we
      # spend per PR would report nothing back to the PR.
      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN }}
          exitZeroOnChanges: true

      - name: Comment the result on the pull request
        if: github.event_name == 'pull_request_review' && steps.chromatic.outputs.changeCount != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHANGE_COUNT: ${{ steps.chromatic.outputs.changeCount }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- chromatic-pr -->";
            const count = Number(process.env.CHANGE_COUNT);
            const body = [
              marker,
              "## 🎨 Chromatic",
              "",
              count > 0
                ? `${count} visual change(s) to review before merging.`
                : "No visual changes.",
              "",
              `[View the build](${process.env.BUILD_URL})`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # actualCaptureCount is what is billed at 1x and inheritedCaptureCount is
      # what TurboSnap copied at 0.2x, so this is the real per-build cost
      # against the monthly quota rather than an estimate. Inherited at 0 on a
      # small PR means TurboSnap did not engage: check the build log for the
      # reason (a dependency change, a `.storybook/` change, or a `preview.tsx`
      # import all force a full rebuild by design).
      - name: Record the snapshot usage
        if: always()
        env:
          CAPTURED: ${{ steps.chromatic.outputs.actualCaptureCount }}
          INHERITED: ${{ steps.chromatic.outputs.inheritedCaptureCount }}
          CHANGES: ${{ steps.chromatic.outputs.changeCount }}
          ERRORS: ${{ steps.chromatic.outputs.errorCount }}
          SPECS: ${{ steps.chromatic.outputs.specCount }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        run: |
          {
            echo "### Chromatic"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| Stories | ${SPECS:-n/a} |"
            echo "| Captured (billed 1x) | ${CAPTURED:-n/a} |"
            echo "| Inherited via TurboSnap (billed 0.2x) | ${INHERITED:-n/a} |"
            echo "| Visual changes | ${CHANGES:-n/a} |"
            echo "| Errored stories | ${ERRORS:-n/a} |"
            echo "| Build | ${BUILD_URL:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
