<div
  class="tedi-toast__wrapper"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>
  <tedi-alert
    [title]="title()"
    [type]="type()"
    [icon]="icon()"
    [showClose]="true"
    [closeDelay]="300"
    role="none"
    (closeClick)="handleClose()"
  >
    <ng-content></ng-content>
  </tedi-alert>
  @if (showProgressBar() && duration() > 0) {
    <div
      class="tedi-toast__progress tedi-toast__progress--{{ type() }}"
      [class.tedi-toast__progress--paused]="paused()"
      [style.animation-duration.ms]="duration()"
    ></div>
  }
</div>
