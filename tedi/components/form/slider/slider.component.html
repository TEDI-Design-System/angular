@if (label()) {
  <label
    tedi-label
    [for]="inputId()"
    [required]="required()"
    [class.sr-only]="hideLabel() === true"
    [class.tedi-slider__label--reserve-space]="hideLabel() === 'keep-space'"
  >
    {{ label() }}
  </label>
}
<div class="tedi-slider__container">
  <div class="tedi-slider__track-row">
    @if (minLabel() != null) {
      <span class="tedi-slider__range-label" aria-hidden="true">{{ minLabel() }}</span>
    }
    <div class="tedi-slider__track" [style]="progressStyle()">
      <input
        type="range"
        class="tedi-slider__input"
        [id]="inputId()"
        [attr.name]="name()"
        [attr.min]="min()"
        [attr.max]="max()"
        [attr.step]="step()"
        [value]="clampedValue()"
        [disabled]="isDisabled()"
        [required]="required()"
        [attr.aria-invalid]="isInvalid() ? 'true' : null"
        [attr.aria-describedby]="feedbackId()"
        [attr.aria-label]="ariaLabel()"
        [attr.aria-labelledby]="ariaLabelledby()"
        [attr.aria-valuetext]="ariaValuetext()"
        (input)="handleInput($event)"
        (mouseenter)="handleMouseEnter()"
        (mouseleave)="handleMouseLeave()"
        (pointerdown)="handlePointerDown()"
        (focus)="handleFocus()"
        (blur)="handleBlur()"
      />
      @if (canShowTooltip()) {
        <tedi-tooltip
          openWith="none"
          position="top"
          [offset]="0"
          [open]="tooltipOpen()"
          [trackPosition]="isDragging() || isFocused()"
        >
          <tedi-tooltip-trigger
            class="tedi-slider__thumb-anchor"
            [interactive]="false"
          ></tedi-tooltip-trigger>
          <tedi-tooltip-content>{{ formattedValue() }}</tedi-tooltip-content>
        </tedi-tooltip>
      }
    </div>
    @if (rightLabel() != null) {
      <span
        class="tedi-slider__range-label"
        [attr.aria-hidden]="showCurrentValue() ? null : 'true'"
        [attr.aria-live]="showCurrentValue() ? 'polite' : null"
      >
        {{ rightLabel() }}
      </span>
    }
  </div>
  <div class="tedi-slider__addon">
    <ng-content select="[sliderAddon]" />
  </div>
</div>
@if (feedbackText(); as feedback) {
  <tedi-feedback-text
    [attr.id]="feedbackId()"
    [text]="feedback.text"
    [type]="feedback.type"
    [position]="feedback.position"
  />
}
