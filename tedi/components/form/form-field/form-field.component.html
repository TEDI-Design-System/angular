<ng-content select="label[tedi-label]"></ng-content>

<div [ngClass]="inputClasses()" (mousedown)="handleBoxMouseDown($event)">
  <ng-content
    select="input[tedi-text-field], textarea[tedi-textarea], tedi-time-field, tedi-date-field"
  ></ng-content>

  @if (clearable() && !isTextarea()) {
    <div
      class="tedi-form-field__buttons"
      [class.tedi-form-field__buttons--hidden]="!showClearButton()"
      [attr.aria-hidden]="!showClearButton() || null"
    >
      <button
        class="tedi-form-field__clear"
        tedi-closing-button
        type="button"
        size="small"
        [ariaLabel]="'clear' | tediTranslate"
        [iconSize]="18"
        [tabIndex]="showClearButton() ? 0 : -1"
        [disabled]="isDisabled() || !showClearButton()"
        (click)="clear()"
      ></button>

      @if (icon()) {
        <tedi-separator axis="vertical" size="1rem" />
      }
    </div>
  }

  @if (resolvedIcon(); as icon) {
    <div class="tedi-form-field__icon">
      <tedi-icon
        [name]="icon.name"
        [size]="
          icon.size ?? (size() === 'small' ? 16 : size() === 'large' ? 24 : 18)
        "
        [color]="icon.color ?? 'inherit'"
        [type]="icon.type ?? 'outlined'"
        [variant]="icon.variant ?? 'outlined'"
        [attr.aria-hidden]="true"
      />
    </div>
  }
</div>

@if (feedback || characterLimit() != null) {
  <div class="tedi-form-field__feedback">
    <ng-content select="tedi-feedback-text"></ng-content>

    @if (characterLimit() != null) {
      <span
        class="tedi-form-field__character-count"
        [class.tedi-form-field__character-count--error]="
          characterCountExceeded()
        "
      >
        {{ characterCount() }}/{{ characterLimit() }}
      </span>
    }
  </div>
}

<div class="tedi-form-field__extra">
  <ng-content></ng-content>
</div>
