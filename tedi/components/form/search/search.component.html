<tedi-form-field
  class="tedi-search__field"
  [size]="size()"
  [icon]="fieldIcon()"
  [clearable]="clearable() && !isDisabled()"
  [inputClass]="button() ? 'tedi-search__input--has-button' : null"
>
  @if (label()) {
    <label
      tedi-label
      [for]="inputId()"
      [size]="size() === 'small' ? 'small' : 'default'"
    >
      {{ label() }}
    </label>
  }

  <input
    #searchInput
    tedi-text-field
    type="text"
    role="searchbox"
    [id]="inputId()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [attr.aria-describedby]="feedbackId()"
    (valueChange)="onInputValue($event)"
    (clear)="onClear()"
    (keydown.enter)="emitSearch()"
    (blur)="onBlur()"
  />

  @if (feedbackText(); as feedback) {
    <tedi-feedback-text
      [attr.id]="feedbackId()"
      [text]="feedback.text"
      [type]="feedback.type"
      [position]="feedback.position"
    />
  }
</tedi-form-field>

@if (button(); as btn) {
  <button
    tedi-button
    type="button"
    class="tedi-search__button"
    [variant]="btn.variant ?? 'primary'"
    [size]="buttonSize()"
    [disabled]="isDisabled()"
    [attr.aria-label]="buttonAriaLabel()"
    (click)="emitSearch()"
  >
    <tedi-icon [name]="btn.icon ?? 'search'" color="white" [size]="buttonIconSize()" />
    @if (btn.text) {
      {{ btn.text }}
    }
  </button>
}
