<!-- Project custom tedi-dropdown-item-value directly if provided -->
<ng-content select="tedi-dropdown-item-value" />

<!-- Default wrapper for plain text content -->
@if (!customItemValue()) {
  <tedi-dropdown-item-value>
    <tedi-dropdown-item-value-label>
      <ng-content />
    </tedi-dropdown-item-value-label>
  </tedi-dropdown-item-value>
}
