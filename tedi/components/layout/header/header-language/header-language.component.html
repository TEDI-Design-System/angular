<span
  tedi-text
  color="secondary"
  modifiers="small"
  class="tedi-header-language__label"
  >{{ "header.select-lang" | tediTranslate }}</span
>
<tedi-popover [withBorder]="true" position="bottom" [preventOverflow]="true">
  <button
    type="button"
    tedi-popover-trigger
    class="tedi-link tedi-header__link-button"
  >
    <span>{{ languages()[translationService.getLanguage()] }}</span>
    <tedi-icon
      name="expand_more"
      color="inherit"
      class="tedi-header-language__chevron"
    />
  </button>
  <tedi-popover-content maxWidth="none">
    @for (language of languageKeys(); track language) {
      <button
        type="button"
        class="tedi-link tedi-header__link-button"
        (click)="handleChangeLang(language)"
      >
        <span>{{ languages()[language] }}</span>
      </button>
    }
  </tedi-popover-content>
</tedi-popover>
