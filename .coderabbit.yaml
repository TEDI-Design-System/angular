language: en
early_access: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - rc
      - main

  tools:
    eslint:
      enabled: true
    stylelint:
      enabled: true

  path_instructions:
    - path: "**"
      instructions: |
        Read and enforce the project conventions from these files:
        - `AGENTS.md`: project overview, architecture, component patterns, styling rules, and "Do NOT" list.
        - `.agents/skills/contributing/references/best-practices.md`: detailed coding patterns for components, input API, comments and JSDoc, SCSS, and barrel exports.
        - `.agents/skills/contributing/references/testing.md`: test patterns and required providers.
        - `.agents/skills/contributing/references/stories.md`: story structure, argTypes, composition and prose rules.
        - `.agents/skills/contributing/references/pr-review.md`: review checklist. Enforce its Input API and Prose sections, except the TEDI React parity item (the sibling repo isn't available in CI).

        Don't flag anything listed under "Key things to not flag" in `AGENTS.md`.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
