<ng-template #tabsList><ng-content select="[tedi-tab]" /></ng-template>

<tedi-card background="primary" [padding]="0">
  <tedi-card-content>
    <div role="tablist" class="tedi-tabs__tab-list">
      @if (!mobileTabsOpened()) {
        <ng-container *ngTemplateOutlet="tabsList" />
      }
      <button
        aria-haspopup="menu"
        (click)="mobileTabsOpened.set(true)"
        class="tedi-tab tedi-tab--more-btn"
      >
        {{ "more" | tediTranslate }}
        <tedi-icon name="expand_more" [size]="18" />
      </button>
    </div>
  </tedi-card-content>

  <tedi-card-content
    role="tabpanel"
    [attr.aria-labelledby]="activeTabId()"
    [padding]="{ horizontal: 1, vertical: 1.5 }"
  >
    @if (activeTabContent(); as activeContent) {
      <ng-container *ngTemplateOutlet="activeContent" />
    }
    <ng-content></ng-content>
  </tedi-card-content>
</tedi-card>

@if (mobileTabsOpened()) {
  <tedi-card
    class="tedi-tabs__mobile-dropdown"
    background="primary"
    [padding]="0"
  >
    <tedi-card-content
      class="tedi-tabs__mobile-header"
      [autoWidth]="true"
      [padding]="0.5"
    >
      <button
        tedi-closing-button
        size="small"
        (click)="mobileTabsOpened.set(false)"
      ></button>
    </tedi-card-content>
    <tedi-card-content class="tedi-tabs__mobile-list">
      <ng-container *ngTemplateOutlet="tabsList" />
    </tedi-card-content>
  </tedi-card>
}
