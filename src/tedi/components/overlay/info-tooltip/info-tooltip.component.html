<tedi-tooltip [position]="position()" [openWith]="openWith()">
  <tedi-tooltip-trigger>
    <button
      tedi-info-button
      [color]="color()"
      [aria-label]="ariaLabel()"
    ></button>
  </tedi-tooltip-trigger>
  <tedi-tooltip-content [maxWidth]="maxWidth()">
    <ng-content />
  </tedi-tooltip-content>
</tedi-tooltip>
