<div class="tedi-modal-header__head">
  <ng-content select="h1,h2,h3,h4,h5,h6" />
  @if (showClose()) {
    <button
      tedi-closing-button
      class="tedi-modal-header__close"
      [size]="effectiveCloseButtonSize()"
      (click)="closeModal()"
    ></button>
  }
</div>
<ng-content select="[tedi-modal-description]" />
<ng-content />
