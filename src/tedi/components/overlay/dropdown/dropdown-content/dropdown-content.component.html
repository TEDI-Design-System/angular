<ng-content select="[tedi-dropdown-header]" />
<ng-content />
<ul
  class="tedi-dropdown-content__list"
  [class.tedi-dropdown-content__list--plain]="!isWidget()"
  [id]="containerId()"
  [attr.role]="dropdownRole()"
  [attr.aria-labelledby]="containerId() + '_trigger'"
  [attr.aria-multiselectable]="multiselectable() || null"
>
  <ng-content select="li[tedi-dropdown-item], li[tedi-dropdown-separator]" />
</ul>
