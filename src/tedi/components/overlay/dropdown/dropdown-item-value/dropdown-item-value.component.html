@if (type() === "checkbox") {
  <input
    type="checkbox"
    tedi-checkbox
    class="tedi-dropdown-item-value__checkbox"
    inert
    aria-hidden="true"
    [checked]="selected()"
    [indeterminate]="indeterminate()"
    [disabled]="disabled()"
    (click)="onIndicatorClick($event)"
  />
} @else if (type() === "radio") {
  <input
    type="radio"
    class="tedi-dropdown-item-value__radio"
    inert
    aria-hidden="true"
    [checked]="selected()"
    [disabled]="disabled()"
    (click)="onIndicatorClick($event)"
  />
}
@if (resolvedIcon(); as icon) {
  <tedi-icon
    [name]="icon.name"
    [size]="icon.size"
    [color]="icon.color"
    [type]="icon.type ?? 'outlined'"
    [variant]="icon.variant ?? 'outlined'"
  />
}
<ng-content select="tedi-icon, [tediIcon]" />
<div class="tedi-dropdown-item-value__content">
  <ng-content select="tedi-dropdown-item-value-label" />
  <ng-content select="tedi-dropdown-item-value-meta" />
</div>
<ng-content />
