<ng-content select="[tedi-dropdown-trigger]" />
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="overlayOrigin()"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="overlayPositions()"
  (overlayOutsideClick)="onOutsideClick($event)"
>
  <div
    class="tedi-dropdown__panel"
    [class.tedi-dropdown__panel--fixed-width]="panelWidth()"
    [style.width]="panelWidth()"
    [class.tedi-dropdown__panel--max-height]="panelMaxHeight()"
    [style.--_tedi-dropdown-max-height]="panelMaxHeight()"
    [style.--_tedi-dropdown-trigger-width]="triggerWidthVar()"
    (keydown)="onPanelKeydown($event)"
  >
    <ng-content select="tedi-dropdown-content" />
  </div>
</ng-template>
