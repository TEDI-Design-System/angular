<input
  #inputElement
  type="text"
  class="tedi-date-picker__input"
  role="combobox"
  aria-autocomplete="none"
  aria-haspopup="dialog"
  [class.tedi-date-picker__input--small]="inputSize() === 'small'"
  [class.tedi-date-picker__input--valid]="inputState() === 'valid'"
  [class.tedi-date-picker__input--error]="inputState() === 'error'"
  [attr.id]="inputId()"
  [attr.placeholder]="inputPlaceholder()"
  [attr.aria-expanded]="!fieldDisabled() && popover().isOpen()"
  [attr.aria-controls]="uniqueId"
  [attr.aria-readonly]="!allowManualInput()"
  [readOnly]="!allowManualInput()"
  [value]="inputValue()"
  [disabled]="fieldDisabled()"
  (input)="onInput($event)"
  (blur)="onInputBlur()"
  (click)="onInputClick()"
/>
<div class="tedi-date-picker__input-buttons">
  @if (selected()) {
    <button
      tedi-closing-button
      type="button"
      size="small"
      class="tedi-date-picker__clear"
      [iconSize]="18"
      [ariaLabel]="'date-picker.clear-date' | tediTranslate"
      [disabled]="fieldDisabled()"
      (click)="clearInput()"
    ></button>
    <tedi-separator axis="vertical" size="1rem" />
  }
  <tedi-popover
    style="display: flex; align-items: center"
    position="bottom-end"
    [withArrow]="false"
    [preventOverflow]="true"
  >
    <button
      tedi-button
      tedi-popover-trigger
      type="button"
      variant="neutral"
      size="small"
      class="tedi-date-picker__toggle"
      [attr.aria-label]="'date-picker.open-calendar' | tediTranslate"
      [disabled]="fieldDisabled()"
      (click)="openCalendar()"
    >
      <tedi-icon name="calendar_today" size="inherit" />
    </button>
    <tedi-popover-content maxWidth="none" style="padding: 0">
      <div
        class="tedi-date-picker__calendar"
        (keydown)="onCalendarKeyDown($event)"
      >
        <tedi-date-picker-header
          [uniqueId]="uniqueId"
          [currentView]="currentView()"
          [month]="month()"
          [monthMode]="monthMode()"
          [yearMode]="yearMode()"
          [showNavigation]="showNavigation()"
          [canGoPrev]="canGoPrev()"
          [canGoNext]="canGoNext()"
          [selectedYear]="selectedYear()"
          [years]="years()"
          [pagedYears]="pagedYears()"
          [hasPrevYearPage]="hasPrevYearPage()"
          [hasNextYearPage]="hasNextYearPage()"
          [disabledMonths]="disabledMonths()"
          [disabledYears]="disabledYears()"
          (prevMonth)="prevMonth()"
          (nextMonth)="nextMonth()"
          (monthSelect)="onMonthSelect($event)"
          (yearSelect)="onYearSelect($event)"
          (monthClick)="onMonthClick()"
          (yearClick)="onYearClick()"
          (prevYearPage)="prevYearPage()"
          (nextYearPage)="nextYearPage()"
        />

        @if (currentView() === "calendar-grid") {
          <tedi-date-picker-calendar-grid
            #gridElement
            [gridId]="uniqueId"
            [weekRows]="weekRows()"
            [weekNumbers]="weekNumbers()"
            [showWeekNumbers]="showWeekNumbers()"
            [activeDate]="activeDate()"
            [selected]="selected()"
            [today]="today"
            (daySelect)="selectDay($event)"
            (dayKeydown)="onDayKeydown($event.event, $event.date)"
          />
        } @else if (currentView() === "month-grid") {
          <tedi-date-picker-month-grid
            [currentMonth]="month()"
            (monthSelect)="onMonthSelect($event)"
          />
        } @else if (currentView() === "year-grid") {
          <tedi-date-picker-year-grid
            [pagedYears]="pagedYears()"
            [selectedYear]="selectedYear()"
            (yearSelect)="onYearSelect($event)"
          />
        }
      </div>
    </tedi-popover-content>
  </tedi-popover>
</div>
