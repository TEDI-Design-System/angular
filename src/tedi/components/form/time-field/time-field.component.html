@if (usePopover()) {
  <!--
    The field wrapper is the popover anchor + trigger, so the picker matches the
    input width. Button-trigger mode disables clicks on everything but the icon
    (see SCSS); input-trigger mode opens from anywhere in the field.
  -->
  <tedi-popover
    #popover
    class="tedi-time-field__popover"
    [position]="popoverPosition()"
    [withArrow]="false"
    [preventOverflow]="true"
  >
    <div
      #fieldEl
      tedi-popover-trigger
      [interactive]="false"
      class="tedi-time-field__field"
      [class.tedi-time-field__field--button-trigger]="!inputIsTrigger()"
      [class.tedi-field-surface]="paintsSurface()"
      [class.tedi-field-surface--invalid]="paintsSurface() && invalid()"
      [class.tedi-field-surface--valid]="paintsSurface() && valid()"
      [class.tedi-field-surface--disabled]="paintsSurface() && disabled()"
      [attr.tabindex]="-1"
      (focus)="onFieldFocus($event)"
      (click)="onFieldClick()"
    >
      <ng-container *ngTemplateOutlet="timeInput" />
      <div class="tedi-time-field__actions">
        <ng-container *ngTemplateOutlet="clearButton" />
        <button
          tedi-button
          type="button"
          variant="neutral"
          size="small"
          class="tedi-time-field__icon"
          [class.tedi-time-field__icon--open]="popoverIsOpen()"
          [attr.aria-label]="'time-field.select-time' | tediTranslate"
          [attr.aria-expanded]="popoverIsOpen() || null"
          aria-haspopup="dialog"
          (click)="onIconClick()"
        >
          <tedi-icon name="schedule" color="inherit" size="inherit" />
        </button>
      </div>
    </div>
    <tedi-popover-content
      class="tedi-time-field__popover-content"
      maxWidth="none"
    >
      <ng-container *ngTemplateOutlet="pickerWheel" />
    </tedi-popover-content>
  </tedi-popover>
} @else {
  <!-- No picker / native picker / mobile-modal / disabled: plain field, no popover. -->
  <div
    #fieldEl
    class="tedi-time-field__field"
    [class.tedi-field-surface]="paintsSurface()"
    [class.tedi-field-surface--invalid]="paintsSurface() && invalid()"
    [class.tedi-field-surface--valid]="paintsSurface() && valid()"
    [class.tedi-field-surface--disabled]="paintsSurface() && disabled()"
  >
    <ng-container *ngTemplateOutlet="timeInput" />
    <div class="tedi-time-field__actions">
      <ng-container *ngTemplateOutlet="clearButton" />
      @if (hasNativePicker()) {
        <button
          tedi-button
          type="button"
          variant="neutral"
          size="small"
          class="tedi-time-field__icon"
          [attr.aria-label]="'time-field.select-time' | tediTranslate"
          [disabled]="isDisabled()"
          (click)="openNativePicker()"
        >
          <tedi-icon name="schedule" color="inherit" size="inherit" />
        </button>
      } @else if (hasPicker()) {
        <button
          tedi-button
          type="button"
          variant="neutral"
          size="small"
          class="tedi-time-field__icon"
          [attr.aria-label]="'time-field.select-time' | tediTranslate"
          [disabled]="isDisabled()"
          (click)="openPicker()"
        >
          <tedi-icon name="schedule" color="inherit" size="inherit" />
        </button>
      } @else {
        <span
          class="tedi-time-field__icon tedi-time-field__icon--static"
          aria-hidden="true"
        >
          <tedi-icon name="schedule" color="inherit" size="inherit" />
        </span>
      }
    </div>
  </div>
}

<ng-template #timeInput>
  <input
    #inputElement
    class="tedi-time-field__input"
    inputmode="numeric"
    [type]="inputType()"
    [id]="inputId()"
    [attr.placeholder]="placeholder()"
    [value]="inputValue()"
    [disabled]="isDisabled()"
    [readOnly]="inputIsTrigger()"
    [attr.aria-invalid]="invalid() || null"
    (click)="onInputClick($event)"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
</ng-template>

<ng-template #clearButton>
  @if (showClear()) {
    <button
      tedi-closing-button
      type="button"
      size="small"
      class="tedi-time-field__clear"
      [iconSize]="18"
      [ariaLabel]="'time-field.clear' | tediTranslate"
      [disabled]="isDisabled()"
      (click)="onClearClick($event)"
    ></button>
    <tedi-separator axis="vertical" size="1rem" />
  }
</ng-template>

<ng-template #pickerWheel>
  <tedi-time-picker
    #timePicker
    [value]="value()"
    [variant]="customPickerVariant()"
    [timeSlots]="timeSlots()"
    [columns]="columns()"
    [showSlotIndicator]="showSlotIndicator()"
    [minuteStep]="minuteStep()"
    [trapFocus]="true"
    [style.--tedi-time-picker-dropdown-min-width.px]="dropdownMinWidth()"
    (valueChange)="onPickerValueChange($event)"
    (closeRequested)="closePopover()"
  />
</ng-template>
