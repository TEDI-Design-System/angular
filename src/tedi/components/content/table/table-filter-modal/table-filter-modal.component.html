<tedi-modal>
  <tedi-modal-header>
    <h2>{{ data.columnLabel }}</h2>
  </tedi-modal-header>
  <tedi-modal-content>
    <ng-container *ngTemplateOutlet="data.template; context: context" />
  </tedi-modal-content>
  @if (data.actions.length) {
    <tedi-modal-footer>
      @for (item of data.actions; track item.action) {
        <button
          tedi-button
          size="small"
          type="button"
          [variant]="item.action === 'apply' ? 'primary' : 'secondary'"
          (click)="context[item.action]()"
        >
          {{ item.label }}
        </button>
      }
    </tedi-modal-footer>
  }
</tedi-modal>
