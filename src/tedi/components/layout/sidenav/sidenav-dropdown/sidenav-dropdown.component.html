@if (sidenavService.isCollapsed() && !!sidenavItem?.href()) {
  <li
    tedi-sidenav-dropdown-item
    class="tedi-sidenav-dropdown-item--parent"
    [href]="sidenavItem?.href()"
  >
    {{ sidenavItem?.textContent() }}
  </li>
} @else if (sidenavService.isCollapsed() && !!sidenavItem?.route()) {
  <li
    tedi-sidenav-dropdown-item
    class="tedi-sidenav-dropdown-item--parent"
    [route]="sidenavItem?.route()"
  >
    {{ sidenavItem?.textContent() }}
  </li>
}
<ng-content></ng-content>
